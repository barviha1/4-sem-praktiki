<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои задачи</title>

    <link rel="manifest" href="./manifest.json">

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#4285f4">

    <link rel="apple-touch-icon" href="icons/favicon-256x256.png">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="icon" href="/icons/favicon-128x128.png" type="image/png">

    <link rel="stylesheet" href="https://unpkg.com/chota@latest">
    <style>
        body { max-width: 800px; margin: 40px auto; padding: 20px; }
        li { padding: 12px 0; border-bottom: 1px solid #ddd; font-size: 1.1em; }
    </style>
</head>
<body>
    <h1>Мои заметки</h1>
    <form id="task-form" class="row">
        <input class="col-9" type="text" id="task-input" placeholder="Введите задачу" required>
        <button class="col-3" type="submit">Добавить</button>
    </form>
    <ul id="tasks-list" class="mt-3"></ul>

    <script src="app.js"></script>
</body>
</html>
